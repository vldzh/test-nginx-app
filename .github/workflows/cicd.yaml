name: CI/CD — Build & Deploy to Yandex Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  CLUSTER_ID: ${{ secrets.YC_K8S_CLUSTER_ID }}
  IMAGE_NAME: test-nginx-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # === Authenticate YC CLI using static key (recommended for CI) ===
      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure yc CLI with static credentials
        run: |
          yc config set folder-id ${{ env.FOLDER_ID }}
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set zone ru-central1-a
        env:
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Configure Docker to use YC Container Registry
        run: yc container registry configure-docker

      # === Build & Push Images ===
      - name: Build Docker image with commit hash and 'latest' tags
        run: |
          COMMIT_SHORT=${GITHUB_SHA::8}
          REGISTRY="cr.yandex/${{ env.REGISTRY_ID }}"
          IMAGE_COMMIT="$REGISTRY/${{ env.IMAGE_NAME }}:$COMMIT_SHORT"
          IMAGE_LATEST="$REGISTRY/${{ env.IMAGE_NAME }}:latest"

          docker build -t "$IMAGE_COMMIT" -t "$IMAGE_LATEST" .

          docker push "$IMAGE_COMMIT"
          docker push "$IMAGE_LATEST"

      # === Deploy to Kubernetes ===
      - name: Get Kubeconfig for Yandex Managed Kubernetes
        run: yc managed-kubernetes cluster get-credentials ${{ env.CLUSTER_ID }} --external

      - name: Deploy latest image to Kubernetes
        run: |
          kubectl set image deployment/test-nginx-app \
            test-nginx-app=cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest \
            --record