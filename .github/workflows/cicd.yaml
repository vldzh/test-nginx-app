# .github/workflows/ci-cd.yaml
name: Build & Deploy Nginx App via Yandex CI/CD

on:
  push:
    branches: [main]
  release:
    types: [published]  

env:
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  YC_K8S_CLUSTER_ID: ${{ secrets.YC_K8S_CLUSTER_ID }}
  YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
  YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
  YC_SA_ID: ${{ secrets.YC_SA_ID }}

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Docker for Yandex Container Registry
        run: yc container registry configure-docker

      - name: Login to Yandex Container Registry
        run: |
          # Устанавливаем yc CLI и необходимые инструменты
          sudo apt-get update && sudo apt-get install -y curl jq
        
          # Создаем файл с JSON ключом
          echo '${{ secrets.YC_SA_KEY }}' > sa-key.json
        
          # Устанавливаем yc CLI
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          export PATH="$HOME/yandex-cloud/bin:$PATH"
        
          # Настраиваем yc
          yc config set service-account-key sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
        
          # Получаем IAM токен
          IAM_TOKEN=$(yc iam create-token)
          echo "IAM token first 10 chars: ${IAM_TOKEN:0:10}..."
        
          # Логинимся в Container Registry
          echo $IAM_TOKEN | docker login --username iam --password-stdin cr.yandex
        
          # Очищаем чувствительные данные
          rm sa-key.json
        
          # Проверяем логин
          echo "Docker config:"
          cat ~/.docker/config.json | grep -A2 -B2 "cr.yandex" || true
    
      - name: Build Docker image
        run: |
          # Создаем тег с SHA коммита
          IMAGE_TAG=${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${GITHUB_SHA::8}
          IMAGE_LATEST=${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:latest
        
          echo "Building image: $IMAGE_TAG"
          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
        
          # Показываем список образов
          docker images | grep ${IMAGE_NAME}
    
      - name: Push Docker images
        run: |
          IMAGE_TAG=${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${GITHUB_SHA::8}
          IMAGE_LATEST=${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:latest
        
          echo "Pushing $IMAGE_TAG"
          docker push $IMAGE_TAG
        
          echo "Pushing $IMAGE_LATEST"
          docker push $IMAGE_LATEST 

      - name: Fetch Kubeconfig
        run: |
          mkdir -p ~/.kube
          yc managed-kubernetes cluster get-credentials $YC_K8S_CLUSTER_ID --external

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/test-nginx-app \
            test-nginx-app=${{ steps.meta.outputs.IMAGE }} \
            --namespace=default \
            --record

      - name: Wait for rollout
        run: kubectl rollout status deployment/test-nginx-app --namespace=default --timeout=5m